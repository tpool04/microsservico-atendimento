#definir o dialeto de banco de dados que serï¿½ utilizado pelo hibernate
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#configuraï¿½ï¿½o para que o hibernate atualize o banco de dados conforme o mapeamento
#das entidades, criando tabelas ou modificando tabelas ja existentes
spring.jpa.hibernate.ddl-auto=update

#configuraï¿½ï¿½o para que seja gerado um log de todas as operaï¿½ï¿½es que o hibernate
#executar no banco de dados (sentenï¿½as SQL)
spring.jpa.show-sql=true

